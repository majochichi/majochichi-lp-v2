<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
　<link rel="stylesheet" href="style.css">
  <title>魂の翻訳者｜魔女chichi｜majochichi</title>

  <meta
    name="description"
    content="あなたの中に、眠れる魔法がある。その光を、そっと言葉にします。魂の翻訳者｜魔女chichi"
  >
</head>

<body>

  <main>

  <section id="first-view">

  <div class="first-view-inner">

    <div class="first-view-copy">
      <p class="first-view-role">魂の翻訳者｜魔女chichi</p>

      <h1>
        あなたの中に、<br>
        <span class="keep-line">眠れる魔法がある。</span>
      </h1>

      <p class="first-view-message">
        その光を、<br>
        そっと言葉にします。
      </p>

      <p class="first-view-signature">majochichi</p>
    </div>

    <div class="first-view-visual">
      <img
        src="assets/IMG_8016.jpeg"
        alt="薔薇と光に包まれ、静かに目を閉じる女性のイラスト"
      >
    </div>

  </div>

  <p class="first-view-scroll">Scroll ↓</p>

</section>  
<section id="message" class="message-section">
  <div class="message-inner">

    <p class="message-lead">
      心の奥には、<br>
      あなたに見つけて欲しい<br>
      言葉や想いがあります。
    </p>

    <div class="message-body">
      <p>
        ふと、心が揺れるとき。<br><br>
        胸の奥に、<br>
        小さな光を感じるとき。<br><br>
        静かな時間の中で、<br>
        心の声が聞こえてくるとき。
      </p>

      <p>
        そのひとつひとつは、<br>
        あなたの中から生まれた<br>
        大切なもの。
      </p>

      <p>
        わたしは、<br>
        その声にそっと耳を澄ませます。
      </p>

      <p>
        あなたの想いが、<br>
        あなた自身の言葉となって<br>
        心に届くように。
      </p>
    </div>

  </div>
</section>
  </main>

</body>
</html>
